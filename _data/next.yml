- speaker: "Malametenia Vlachou-Efstathiou"
  date: "17 November 2026"
  time: "10am-12pm"
  affiliation: "IRHT/IMAGINE-ENPC"
  url: "https://malamatenia.github.io"
  title: "Computational Modelling of Medieval Handwriting for Task-Agnostic Paleographical Analysis"
  abstract: "How can computational methods support the description and comparison of medieval handwriting beyond specific classification tasks? This presentation introduces a computer-vision framework for the quantitative and interpretable characterization of historical scripts, combining character morphology with the measurement of spatial properties. Starting from text-line images and their transcriptions, the method detects character instances without requiring manual character-level annotations and produces visual prototypes of letterforms alongside metrological descriptors capturing their dimensions and position within the line.<br/>  
   The presentation examines the technical and methodological choices underlying these representations and their implications for paleographical research. Through different case studies, it aims to show how such an approach can help identify shared and discriminative features, reassess relationships between scribal hands, and investigate the consistency and variability of writing practices. Particular attention is paid to the relationship between computational representations and paleographical interpretation, and to how quantitative measurements and visual evidence can complement established methods of handwriting analysis."
  slides: nothing
  video: nothing
  room: "Salle 70, Bibliothèque nationale de France, Site François-Mitterrand"
- speaker: "Noa Garcia"
  date: "15 December 2026"
  time: "10am-12pm"
  affiliation: "Institute for Advanced Co-Creation Studies and D3 Center, The University of Osaka"
  url: "https://www.noagarciad.com"
  title: "Style and Gender in the Generated Output: From Descriptions to Images"
  abstract: "Artistic style is more than a visual appearance. It emerges from specific socio-historical contexts and can encode the social hierarchies, identities, and gender norms of its time. Yet in computer vision research, style is often treated as a content-independent property, something that can be separated from semantics and defined through color, texture, or brushstroke. In this talk, I will explore what happens when we consider the social and historical dimensions of style in the generated image. I will begin by discussing the longstanding distinction between content and style in computational approaches to art. I will then turn to gender, asking how gendered representations are shaped not only by what images depict, but also by how they depict it. Building on top of this, the talk will explore the relationship between gender and artistic style across both historical artworks and contemporary generative images, showing how generative models inherit and intensify gendered patterns from art history when prompted to generate images in specific artistic styles."
  slides: nothing
  video: nothing
  room: "Salle 70, Bibliothèque nationale de France, Site François-Mitterrand"